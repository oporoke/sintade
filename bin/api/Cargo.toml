[package]
name = "api"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
kernel = { path = "../../crates/kernel" }
platform = { path = "../../crates/platform" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
