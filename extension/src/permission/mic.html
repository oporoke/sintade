<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Allow the microphone · Sintade</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body style="width: auto; max-width: 480px; margin: 40px auto">
    <main>
      <h1>Allow the microphone</h1>
      <p data-testid="mic-status" role="status">
        Your browser will ask to let Sintade use the microphone. Choose Allow.
      </p>
      <button type="button" data-testid="mic-retry" hidden>Ask again</button>
    </main>
    <script type="module" src="mic.js"></script>
  </body>
</html>
