[package]
name = "delivery"
version = "0.1.0"
edition.workspace = true

[lib]
name = "delivery"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.0"
kernel = { version = "0.1.0", path = "../kernel" }
media = { version = "0.1.0", path = "../media" }
platform = { version = "0.1.0", path = "../platform" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "tls-rustls", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.26.1", features = ["v7"] }
