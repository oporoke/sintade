[package]
name = "ingest"
version = "0.1.0"
edition.workspace = true

[lib]
name = "ingest"
path = "src/lib.rs"

[dependencies]
catalog = { version = "0.1.0", path = "../catalog" }
kernel = { version = "0.1.0", path = "../kernel" }
platform = { version = "0.1.0", path = "../platform" }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "tls-rustls", "uuid"] }
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v7"] }
url = "2.5.8"
tracing = "0.1.44"

[dev-dependencies]
async-trait = "0.1.92"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
