[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true

[lib]
name = "kernel"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
