[package]
name = "tenancy"
version = "0.1.0"
edition.workspace = true

[lib]
name = "tenancy"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
identity = { version = "0.1.0", path = "../identity" }
kernel = { version = "0.1.0", path = "../kernel" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "tls-rustls", "uuid"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
