[package]
name = "api"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
identity = { path = "../../crates/identity" }
kernel = { path = "../../crates/kernel" }
platform = { path = "../../crates/platform" }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "request-id", "timeout"] }
tracing = "0.1.44"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.26.1", features = ["v7"] }
