[package]
name = "worker"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
kernel = { path = "../../crates/kernel" }
platform = { path = "../../crates/platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
