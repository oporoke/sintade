[package]
name = "platform"
version = "0.1.0"
edition.workspace = true

[lib]
name = "platform"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
aws-sdk-s3 = "1.149.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2.0.20"
time = "0.3.55"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
