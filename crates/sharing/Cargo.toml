[package]
name = "sharing"
version = "0.1.0"
edition.workspace = true

[lib]
name = "sharing"
path = "src/lib.rs"

[dependencies]
catalog = { version = "0.1.0", path = "../catalog" }
kernel = { version = "0.1.0", path = "../kernel" }
platform = { version = "0.1.0", path = "../platform" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "tls-rustls", "uuid"] }
thiserror = "2.0.21"
time = "0.3.55"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
