[package]
name = "platform"
version = "0.1.0"
edition.workspace = true

[lib]
name = "platform"
path = "src/lib.rs"

[dependencies]
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2.0.20"
time = "0.3.55"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
