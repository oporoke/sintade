name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://app:app@localhost:5432/sintade
  S3_ENDPOINT: http://localhost:9010
  S3_BUCKET: sintade-dev
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio-secret
  PUBLIC_BASE_URL: http://localhost:4200
  SMTP_URL: smtp://localhost:1025
  RUST_LOG: info

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: sintade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d sintade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: quay.io/minio/minio
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio-secret
          MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:4200
        ports: ["9010:9000", "9011:9001"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        # `services:` containers can't run a custom command, so MinIO starts with its default
        # entrypoint here; the bucket is created by a separate step below instead of compose's
        # minio-init job.
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025/api/v1/info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create MinIO bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://minio:minio-secret@localhost:9010 \
            quay.io/minio/minio mc mb --ignore-existing local/sintade-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@sqlx-cli
      - run: sqlx migrate run
      - run: cargo sqlx prepare --check --workspace
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - run: npm audit --audit-level=high
        working-directory: web

  build-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_HOST != ''
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@sqlx-cli
      - name: Run migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd /opt/sintade
            export IMAGE_TAG="$GITHUB_SHA"
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
      - name: Smoke test /readyz
        run: curl -sSf "https://${{ vars.STAGING_HOST }}/api/v1/readyz"
