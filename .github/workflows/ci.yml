name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://app:app@localhost:5432/sintade
  S3_ENDPOINT: http://localhost:9010
  S3_BUCKET: sintade-dev
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio-secret
  PUBLIC_BASE_URL: https://localhost:4200
  SMTP_URL: smtp://localhost:1025
  RUST_LOG: info
  SESSION_SECRET: ggY3SFec8ZtPVVs8WQ64Bb5p9Tqjtm5G00QZf/ti68/nJgXHvhjf4CdMRoENm9o00AvKCujCpmwsYXEQgQZnVw==

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: sintade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d sintade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025/api/v1/info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        # `services:` containers can't be given a command, and MinIO's image requires one
        # (`server /data ...`) -- it just prints its help text and exits without it. Run it as
        # a plain background container instead. Image is our own mirror on GHCR, not
        # quay.io/minio/minio -- see ADR-0005 (MinIO pulled its free images from both Docker
        # Hub and quay.io on 2026-09-24).
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio-secret \
            -e MINIO_API_CORS_ALLOW_ORIGIN=https://localhost:4200 \
            ghcr.io/oporoke/sintade/minio:RELEASE.2025-09-07T16-13-09Z server /data --address :9010 --console-address :9011
          for _ in $(seq 1 20); do
            curl -sf http://localhost:9010/minio/health/live && break
            sleep 1
          done
      - name: Create MinIO bucket
        run: |
          docker run --rm --network host \
            --entrypoint mc \
            -e MC_HOST_local=http://minio:minio-secret@localhost:9010 \
            ghcr.io/oporoke/sintade/minio:RELEASE.2025-09-07T16-13-09Z mb --ignore-existing local/sintade-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - run: sqlx migrate run
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo sqlx prepare --check --workspace
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  contract:
    # The OpenAPI contract (docs/api/openapi.json) and the TS DTOs generated from it
    # (web/src/app/api/schema.ts) must match what the API code produces, and the frontend must
    # compile against them -- a DTO change that breaks a template fails here.
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: just openapi-check
      - run: npm run build
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: sintade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d sintade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025/api/v1/info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - run: sqlx migrate run
      - name: Build and start the worker in the background
        # Day 17's signup-to-login e2e test needs a real worker delivering the verification
        # email to Mailpit. It has no HTTP endpoint for Playwright's webServer to poll for
        # readiness, so it's started as a plain background step here instead -- unlike the API,
        # which playwright.config.ts's own webServer entry starts and polls via /healthz.
        run: |
          cargo build -p worker
          ./target/debug/worker &
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - name: Virtual audio output device
        # Firefox and WebKit only run Web Audio with a working output device; runners have no
        # sound server, so AudioContext never starts there (Day 22). Chromium fakes its own.
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - run: npx playwright test
        working-directory: web
      - name: Show page state of failed e2e tests
        if: failure()
        working-directory: web
        run: |
          for f in test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            sed -n '/Page snapshot/,/Test source/p' "$f"
            echo "::endgroup::"
          done

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - run: npm audit --audit-level=high
        working-directory: web

  build-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_HOST != ''
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Run migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd /opt/sintade
            export IMAGE_TAG="$GITHUB_SHA"
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d
      - name: Smoke test /readyz
        run: curl -sSf "https://${{ vars.STAGING_HOST }}/api/v1/readyz"
