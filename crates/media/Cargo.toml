[package]
name = "media"
version = "0.1.0"
edition.workspace = true

[lib]
name = "media"
path = "src/lib.rs"

[dependencies]
kernel = { version = "0.1.0", path = "../kernel" }
platform = { version = "0.1.0", path = "../platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "tls-rustls", "uuid"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["fs", "io-util", "process", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
