[package]
name = "identity"
version = "0.1.0"
edition.workspace = true

[lib]
name = "identity"
path = "src/lib.rs"

[dependencies]
argon2 = "0.6.0"
email_address = "0.2.9"
kernel = { version = "0.1.0", path = "../kernel" }
platform = { version = "0.1.0", path = "../platform" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time", "tls-rustls", "uuid"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v7"] }
